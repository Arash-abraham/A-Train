[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atrain"
version = "0.4.0"
description = "A high-performance file comparison tool for developers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "A-Train Developers" }]
keywords = ["diff", "compare", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.scripts]
atrain = "atrain.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.10",
]
tui = [
    "textual>=0.60",
]

[tool.setuptools.packages.find]
include = ["atrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["atrain"]
